name: Publish Hugging Face Space

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_ORG: ${{ vars.HF_ORG }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_SPACE_REPO:-}" ]; then
            echo "HF_SPACE_REPO repository variable is required."
            exit 1
          fi
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is required."
            exit 1
          fi

      - name: Build and validate HF package
        run: |
          python scripts/build_hf_space.py
          python scripts/validate_hf_assets.py

      - name: Publish preserved legacy Space
        run: python scripts/publish_hf_portfolio.py --space organization-home
